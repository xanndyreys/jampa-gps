 <!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jampa GPS 2.2</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 32px 36px;
      font-family: Arial, Helvetica, sans-serif;
    }

    #painel {
      display: inline-flex;
      align-items: center;
      gap: 34px;
      max-width: calc(100vw - 72px);
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 650ms ease, transform 650ms ease;
      pointer-events: none;
      white-space: nowrap;
      text-shadow:
        0 2px 2px rgba(0, 0, 0, 1),
        0 0 7px rgba(0, 0, 0, 1),
        0 0 14px rgba(0, 0, 0, 0.95);
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.95));
    }

    #painel.visivel {
      opacity: 1;
      transform: translateY(0);
    }

    .grupo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .icone {
      flex: 0 0 auto;
      font-size: 38px;
      line-height: 1;
    }

    .texto {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
      font-size: 42px;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.5px;
    }

    #temperaturaGrupo[hidden] {
      display: none;
    }

    @media (max-width: 760px) {
      body { padding: 20px; }
      #painel {
        gap: 20px;
        max-width: calc(100vw - 40px);
      }
      .icone { font-size: 30px; }
      .texto { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div id="painel" aria-live="polite">
    <div class="grupo">
      <span class="icone" aria-hidden="true">📍</span>
      <span class="texto" id="bairro">Localização atual</span>
    </div>

    <div class="grupo" id="temperaturaGrupo" hidden>
      <span class="icone" aria-hidden="true">🌡️</span>
      <span class="texto" id="temperatura"></span>
    </div>
  </div>

  <script>
    'use strict';

    const ATRASO_INICIAL_MS = 15_000;
    const TEMPO_SEM_GPS_MS = 60_000;

    const painel = document.getElementById('painel');
    const bairroElemento = document.getElementById('bairro');
    const temperaturaGrupo = document.getElementById('temperaturaGrupo');
    const temperaturaElemento = document.getElementById('temperatura');

    let socket = null;
    let temporizadorInicial = null;
    let temporizadorOcultar = null;
    let temporizadorReconexao = null;
    let primeiroPacotePendente = null;
    let painelJaFoiExibido = false;

    function urlWebSocket() {
      const protocolo = location.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${protocolo}//${location.host}`;
    }

    function preencherPainel(dado) {
      const bairro = typeof dado.bairro === 'string' ? dado.bairro.trim() : '';
      bairroElemento.textContent = bairro || 'Localização atual';

      const valor = Number(dado.temperatura);
      const disponivel =
        dado.temperatura !== null &&
        dado.temperatura !== undefined &&
        dado.temperatura !== '' &&
        Number.isFinite(valor);

      if (disponivel) {
        temperaturaElemento.textContent = `${Math.round(valor)}°C`;
        temperaturaGrupo.hidden = false;
      } else {
        temperaturaElemento.textContent = '';
        temperaturaGrupo.hidden = true;
      }
    }

    function renovarTempoDeVida() {
      clearTimeout(temporizadorOcultar);
      temporizadorOcultar = setTimeout(() => {
        painel.classList.remove('visivel');
        painelJaFoiExibido = false;
        primeiroPacotePendente = null;
      }, TEMPO_SEM_GPS_MS);
    }

    function receberLocalizacao(dado) {
      renovarTempoDeVida();

      if (painelJaFoiExibido) {
        preencherPainel(dado);
        return;
      }

      primeiroPacotePendente = dado;
      if (temporizadorInicial) return;

      temporizadorInicial = setTimeout(() => {
        preencherPainel(primeiroPacotePendente);
        painel.classList.add('visivel');
        painelJaFoiExibido = true;
        temporizadorInicial = null;
      }, ATRASO_INICIAL_MS);
    }

    function ocultarTudo() {
      clearTimeout(temporizadorInicial);
      clearTimeout(temporizadorOcultar);
      temporizadorInicial = null;
      temporizadorOcultar = null;
      primeiroPacotePendente = null;
      painelJaFoiExibido = false;
      painel.classList.remove('visivel');
    }

    function conectar() {
      clearTimeout(temporizadorReconexao);

      try {
        socket = new WebSocket(urlWebSocket());
      } catch (_erro) {
        temporizadorReconexao = setTimeout(conectar, 3000);
        return;
      }

      socket.addEventListener('message', (evento) => {
        try {
          const dado = JSON.parse(evento.data);

          if (dado?.tipo === 'localizacao' && dado.bairro) {
            receberLocalizacao(dado);
          } else if (dado?.tipo === 'ocultar') {
            ocultarTudo();
          }
        } catch (erro) {
          console.error('Mensagem WebSocket inválida:', erro);
        }
      });

      socket.addEventListener('close', () => {
        ocultarTudo();
        temporizadorReconexao = setTimeout(conectar, 3000);
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }

    conectar();
  </script>
</body>
</html>

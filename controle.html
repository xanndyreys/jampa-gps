<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle GPS - Jampa na Orla</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 5px solid #00ffcc;
        }
        h2 { margin-top: 0; color: #00ffcc; }
        .status {
            font-size: 18px;
            margin: 20px 0;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 14px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:active { background: #00cca3; }
        .info { font-size: 14px; color: #aaa; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>📍 Controle de GPS</h2>
        <div class="status" id="status-txt">Aguardando início...</div>
        <button id="btn-iniciar" onclick="iniciarRastreamento()">Ligar Rastreamento</button>
        <div class="info">Mantenha esta página aberta no celular durante a live.</div>
    </div>

    <script>
        const statusTxt = document.getElementById('status-txt');
        const btnIniciar = document.getElementById('btn-iniciar');
        
        let watchId = null;

        function iniciarRastreamento() {
            if (!navigator.geolocation) {
                alert('Seu navegador não suporta geolocalização.');
                return;
            }

            statusTxt.innerText = "Buscando sinal de GPS...";
            btnIniciar.innerText = "Rastreando ao Vivo...";
            btnIniciar.style.background = "#ff5555";

            // Configuração para rastrear o movimento em tempo real
            watchId = navigator.geolocation.watchPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    
                    statusTxt.innerHTML = `Lat: ${lat.toFixed(4)}<br>Lon: ${lon.toFixed(4)}<br><span style="color:#00ffcc">Enviando dados...</span>`;

                    // Envia as coordenadas para o nosso servidor
                    enviarCoordenadasParaServidor(lat, lon);
                },
                (err) => {
                    statusTxt.innerText = "Erro no GPS: " + err.message;
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 10000,
                    timeout: 20000
                }
            );
        }

        async function enviarCoordenadasParaServidor(lat, lon) {
            try {
                // Aqui depois vamos cruzar lat/lon com o bairro real. 
                // Por enquanto, enviamos um teste dinâmico para validar a ponte.
                const resposta = await fetch('/api/atualizar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        bairro: "Tambaú (GPS Ativo)", 
                        temperatura: "29°C" 
                    })
                });
                const resultado = await resposta.json();
                console.log("Atualizado:", resultado);
            } catch (e) {
                console.error("Falha ao enviar para o servidor", e);
            }
        }
    </script>
</body>
</html>

 <!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jampa GPS 2.0</title>
  <style>
    :root {
      color-scheme: dark;
      --fonte-principal: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: clamp(18px, 3vw, 56px);
      font-family: var(--fonte-principal);
    }

    #painel {
      display: inline-flex;
      align-items: center;
      gap: clamp(22px, 3vw, 54px);
      max-width: calc(100vw - 36px);
      padding: 14px 22px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 700ms ease, transform 700ms ease;
      pointer-events: none;
      white-space: nowrap;
      text-shadow:
        0 3px 3px rgba(0, 0, 0, 0.98),
        0 0 8px rgba(0, 0, 0, 0.98),
        0 0 18px rgba(0, 0, 0, 0.95);
      filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.9));
    }

    #painel.visivel {
      opacity: 1;
      transform: translateY(0);
    }

    .grupo {
      display: inline-flex;
      align-items: center;
      gap: clamp(8px, 1vw, 16px);
      min-width: 0;
    }

    .icone {
      flex: 0 0 auto;
      font-size: clamp(56px, 5.2vw, 76px);
      line-height: 1;
    }

    .texto {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #ffffff;
      font-size: clamp(54px, 5vw, 68px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1.5px;
    }

    #temperaturaGrupo[hidden] {
      display: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 18px;
      }

      #painel {
        gap: 18px;
        padding: 10px 12px;
      }

      .icone {
        font-size: clamp(38px, 9vw, 58px);
      }

      .texto {
        font-size: clamp(36px, 8.5vw, 58px);
        letter-spacing: -0.8px;
      }
    }
  </style>
</head>
<body>
  <div id="painel" aria-live="polite">
    <div class="grupo" id="bairroGrupo">
      <span class="icone" aria-hidden="true">📍</span>
      <span class="texto" id="bairro">Localização atual</span>
    </div>

    <div class="grupo" id="temperaturaGrupo" hidden>
      <span class="icone" aria-hidden="true">🌡️</span>
      <span class="texto" id="temperatura"></span>
    </div>
  </div>

  <script>
    'use strict';

    const ATRASO_EXIBICAO_MS = 15_000;
    const TEMPO_SEM_GPS_MS = 60_000;

    const painel = document.getElementById('painel');
    const bairroElemento = document.getElementById('bairro');
    const temperaturaGrupo = document.getElementById('temperaturaGrupo');
    const temperaturaElemento = document.getElementById('temperatura');

    let socket = null;
    let temporizadorExibicao = null;
    let temporizadorOcultar = null;
    let reconexao = null;
    let ultimoDado = null;

    function urlWebSocket() {
      const protocolo = location.protocol === 'https:' ? 'wss:' : 'ws:';
      return `${protocolo}//${location.host}`;
    }

    function cancelarTemporizadores() {
      clearTimeout(temporizadorExibicao);
      clearTimeout(temporizadorOcultar);
      temporizadorExibicao = null;
      temporizadorOcultar = null;
    }

    function ocultarPainel() {
      painel.classList.remove('visivel');
    }

    function preencherPainel(dado) {
      const bairro = typeof dado.bairro === 'string' ? dado.bairro.trim() : '';
      bairroElemento.textContent = bairro || 'Localização atual';

      const temperaturaDisponivel =
        dado.temperatura !== null &&
        dado.temperatura !== undefined &&
        dado.temperatura !== '';
      const temperatura = Number(dado.temperatura);

      if (temperaturaDisponivel && Number.isFinite(temperatura)) {
        temperaturaElemento.textContent = `${Math.round(temperatura)}°C`;
        temperaturaGrupo.hidden = false;
      } else {
        temperaturaElemento.textContent = '';
        temperaturaGrupo.hidden = true;
      }
    }

    function agendarExibicao(dado) {
      ultimoDado = dado;
      cancelarTemporizadores();
      ocultarPainel();

      temporizadorExibicao = setTimeout(() => {
        preencherPainel(ultimoDado);
        painel.classList.add('visivel');
      }, ATRASO_EXIBICAO_MS);

      temporizadorOcultar = setTimeout(() => {
        ocultarPainel();
      }, TEMPO_SEM_GPS_MS);
    }

    function conectar() {
      clearTimeout(reconexao);

      try {
        socket = new WebSocket(urlWebSocket());
      } catch (erro) {
        reconexao = setTimeout(conectar, 3000);
        return;
      }

      socket.addEventListener('message', (evento) => {
        try {
          const dado = JSON.parse(evento.data);
          if (dado?.tipo === 'localizacao' && dado.bairro) {
            agendarExibicao(dado);
          }
        } catch (erro) {
          console.error('Mensagem WebSocket inválida:', erro);
        }
      });

      socket.addEventListener('close', () => {
        ocultarPainel();
        reconexao = setTimeout(conectar, 3000);
      });

      socket.addEventListener('error', () => {
        socket.close();
      });
    }

    conectar();
  </script>
</body>
</html>

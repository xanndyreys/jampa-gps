 <!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087dc1">
  <title>Controle GPS - Jampa na Orla 2</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(160deg, #087dc1, #04a6c2 56%, #f7c843);
      color: #ffffff;
    }

    body {
      display: grid;
      place-items: center;
      padding: 22px;
    }

    main {
      width: min(520px, 100%);
      padding: 28px;
      border-radius: 24px;
      background: rgba(0, 42, 77, 0.82);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 8vw, 40px);
    }

    p {
      margin: 8px 0;
      font-size: 17px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 17px 20px;
      border: 0;
      border-radius: 14px;
      background: #ffd447;
      color: #053858;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    button.desconectar {
      background: #ff5d63;
      color: #ffffff;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.22);
      font-weight: 700;
      word-break: break-word;
    }

    .detalhe {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main>
    <h1>📍 Jampa GPS</h1>
    <p>Envia latitude e longitude para o servidor.</p>
    <p>Mantenha esta tela aberta durante a transmissão.</p>

    <button id="botao" type="button">INICIAR RASTREAMENTO</button>
    <div id="status">Rastreamento desligado.</div>
    <div class="detalhe" id="detalhe"></div>
  </main>

  <script>
    'use strict';

    const PAUSA_INICIAL_MS = 15_000;
    const INTERVALO_MAXIMO_ENVIO_MS = 30_000;
    const DISTANCIA_MINIMA_METROS = 20;

    const botao = document.getElementById('botao');
    const statusElemento = document.getElementById('status');
    const detalheElemento = document.getElementById('detalhe');

    let observadorGps = null;
    let rastreamentoAtivo = false;
    let primeiroEnvioConcluido = false;
    let liberadoParaNovosEnviosEm = 0;
    let ultimoEnvioEm = 0;
    let ultimaLatitudeEnviada = null;
    let ultimaLongitudeEnviada = null;
    let envioEmAndamento = false;
    let ultimaPosicaoPendente = null;

    function definirStatus(texto, detalhe = '') {
      statusElemento.textContent = texto;
      detalheElemento.textContent = detalhe;
    }

    function distanciaEmMetros(lat1, lon1, lat2, lon2) {
      const raioTerra = 6_371_000;
      const rad = (graus) => (graus * Math.PI) / 180;
      const dLat = rad(lat2 - lat1);
      const dLon = rad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * raioTerra * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    async function enviarPosicao(latitude, longitude, precisao) {
      if (!rastreamentoAtivo) return;

      if (envioEmAndamento) {
        ultimaPosicaoPendente = { latitude, longitude, precisao };
        return;
      }

      envioEmAndamento = true;

      try {
        const resposta = await fetch('/gps', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude, longitude }),
        });

        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok) {
          throw new Error(dados.mensagem || `HTTP ${resposta.status}`);
        }

        const agora = Date.now();
        ultimoEnvioEm = agora;
        ultimaLatitudeEnviada = latitude;
        ultimaLongitudeEnviada = longitude;

        if (!primeiroEnvioConcluido) {
          primeiroEnvioConcluido = true;
          liberadoParaNovosEnviosEm = agora + PAUSA_INICIAL_MS;
        }

        const valorTemperatura = Number(dados.temperatura);
        const temperatura =
          dados.temperatura !== null &&
          dados.temperatura !== undefined &&
          dados.temperatura !== '' &&
          Number.isFinite(valorTemperatura)
            ? ` • ${Math.round(valorTemperatura)}°C`
            : '';

        definirStatus(
          `✅ Enviado: ${dados.bairro || 'localização recebida'}${temperatura}`,
          primeiroEnvioConcluido && agora < liberadoParaNovosEnviosEm
            ? 'Aguardando 15 segundos antes das próximas atualizações.'
            : `Precisão aproximada: ${Math.round(precisao)} m`,
        );
      } catch (erro) {
        definirStatus('❌ Falha ao enviar GPS.', erro.message);
      } finally {
        envioEmAndamento = false;

        if (ultimaPosicaoPendente && rastreamentoAtivo) {
          const pendente = ultimaPosicaoPendente;
          ultimaPosicaoPendente = null;
          avaliarPosicao(pendente.latitude, pendente.longitude, pendente.precisao);
        }
      }
    }

    function avaliarPosicao(latitude, longitude, precisao) {
      if (!rastreamentoAtivo) return;

      const agora = Date.now();
      if (primeiroEnvioConcluido && agora < liberadoParaNovosEnviosEm) return;

      if (!primeiroEnvioConcluido) {
        enviarPosicao(latitude, longitude, precisao);
        return;
      }

      const distancia =
        Number.isFinite(ultimaLatitudeEnviada) &&
        Number.isFinite(ultimaLongitudeEnviada)
          ? distanciaEmMetros(
              ultimaLatitudeEnviada,
              ultimaLongitudeEnviada,
              latitude,
              longitude,
            )
          : Infinity;

      const passouTempo = agora - ultimoEnvioEm >= INTERVALO_MAXIMO_ENVIO_MS;
      const mudouPosicao = distancia >= DISTANCIA_MINIMA_METROS;

      if (passouTempo || mudouPosicao) {
        enviarPosicao(latitude, longitude, precisao);
      }
    }

    function aoReceberPosicao(posicao) {
      const { latitude, longitude, accuracy } = posicao.coords;
      avaliarPosicao(latitude, longitude, accuracy);
    }

    function aoFalharGps(erro) {
      const mensagens = {
        1: 'Permissão de localização negada.',
        2: 'Localização indisponível.',
        3: 'Tempo esgotado ao buscar localização.',
      };

      definirStatus('❌ GPS não disponível.', mensagens[erro.code] || erro.message);
    }

    function iniciarRastreamento() {
      if (!('geolocation' in navigator)) {
        definirStatus('❌ Este navegador não oferece GPS.');
        return;
      }

      if (rastreamentoAtivo) return;

      rastreamentoAtivo = true;
      primeiroEnvioConcluido = false;
      liberadoParaNovosEnviosEm = 0;
      ultimoEnvioEm = 0;
      ultimaLatitudeEnviada = null;
      ultimaLongitudeEnviada = null;
      ultimaPosicaoPendente = null;

      botao.textContent = 'DESCONECTAR';
      botao.classList.add('desconectar');
      definirStatus('Solicitando permissão de localização...');

      observadorGps = navigator.geolocation.watchPosition(
        aoReceberPosicao,
        aoFalharGps,
        {
          enableHighAccuracy: true,
          maximumAge: 3_000,
          timeout: 15_000,
        },
      );
    }

    async function desconectar() {
      rastreamentoAtivo = false;

      if (observadorGps !== null) {
        navigator.geolocation.clearWatch(observadorGps);
        observadorGps = null;
      }

      ultimaPosicaoPendente = null;
      botao.textContent = 'INICIAR RASTREAMENTO';
      botao.classList.remove('desconectar');
      definirStatus('Rastreamento desligado.', 'O overlay foi ocultado.');

      try {
        await fetch('/parar', { method: 'POST' });
      } catch (_erro) {
        definirStatus(
          'Rastreamento desligado.',
          'O GPS foi interrompido, mas o servidor não confirmou o comando.',
        );
      }
    }

    botao.addEventListener('click', () => {
      if (rastreamentoAtivo) {
        desconectar();
      } else {
        iniciarRastreamento();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && rastreamentoAtivo) {
        navigator.geolocation.getCurrentPosition(
          aoReceberPosicao,
          aoFalharGps,
          {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 15_000,
          },
        );
      }
    });
  </script>
</body>
</html>

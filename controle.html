 <!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087dc1">
  <title>Controle GPS - Jampa na Orla 2</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(160deg, #087dc1, #04a6c2 56%, #f7c843);
      color: #ffffff;
    }

    body {
      display: grid;
      place-items: center;
      padding: 22px;
    }

    main {
      width: min(520px, 100%);
      padding: 28px;
      border-radius: 24px;
      background: rgba(0, 42, 77, 0.82);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 8vw, 40px);
    }

    p {
      margin: 8px 0;
      font-size: 17px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 17px 20px;
      border: 0;
      border-radius: 14px;
      background: #ffd447;
      color: #053858;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: 0.7;
    }

    #status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.22);
      font-weight: 700;
      word-break: break-word;
    }

    .detalhe {
      margin-top: 12px;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main>
    <h1>📍 Jampa GPS</h1>
    <p>Esta página envia somente latitude e longitude para o servidor.</p>
    <p>Mantenha esta tela aberta durante a transmissão.</p>

    <button id="botao" type="button">INICIAR GPS</button>
    <div id="status">GPS ainda não iniciado.</div>
    <div class="detalhe" id="detalhe"></div>
  </main>

  <script>
    'use strict';

    const INTERVALO_MINIMO_ENVIO_MS = 5_000;
    const DISTANCIA_MINIMA_METROS = 5;

    const botao = document.getElementById('botao');
    const statusElemento = document.getElementById('status');
    const detalheElemento = document.getElementById('detalhe');

    let observadorGps = null;
    let ultimoEnvioEm = 0;
    let envioEmAndamento = false;
    let ultimaPosicaoPendente = null;

    function definirStatus(texto, detalhe = '') {
      statusElemento.textContent = texto;
      detalheElemento.textContent = detalhe;
    }

    async function enviarPosicao(latitude, longitude, precisao) {
      if (envioEmAndamento) {
        ultimaPosicaoPendente = { latitude, longitude, precisao };
        return;
      }

      envioEmAndamento = true;

      try {
        const resposta = await fetch('/gps', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude, longitude }),
        });

        const dados = await resposta.json().catch(() => ({}));

        if (!resposta.ok) {
          throw new Error(dados.mensagem || `HTTP ${resposta.status}`);
        }

        ultimoEnvioEm = Date.now();
        const temperaturaDisponivel =
          dados.temperatura !== null &&
          dados.temperatura !== undefined &&
          dados.temperatura !== '';
        const temperaturaNumero = Number(dados.temperatura);
        const temperatura =
          temperaturaDisponivel && Number.isFinite(temperaturaNumero)
            ? ` • ${Math.round(temperaturaNumero)}°C`
            : '';

        definirStatus(
          `✅ Enviado: ${dados.bairro || 'localização recebida'}${temperatura}`,
          `Precisão aproximada: ${Math.round(precisao)} m`,
        );
      } catch (erro) {
        definirStatus('❌ Falha ao enviar GPS.', erro.message);
      } finally {
        envioEmAndamento = false;

        if (ultimaPosicaoPendente) {
          const pendente = ultimaPosicaoPendente;
          ultimaPosicaoPendente = null;
          enviarPosicao(pendente.latitude, pendente.longitude, pendente.precisao);
        }
      }
    }

    function aoReceberPosicao(posicao) {
      const { latitude, longitude, accuracy } = posicao.coords;
      const agora = Date.now();

      definirStatus(
        '📡 GPS ativo. Enviando localização...',
        `Precisão aproximada: ${Math.round(accuracy)} m`,
      );

      if (agora - ultimoEnvioEm < INTERVALO_MINIMO_ENVIO_MS) return;
      enviarPosicao(latitude, longitude, accuracy);
    }

    function aoFalharGps(erro) {
      const mensagens = {
        1: 'Permissão de localização negada.',
        2: 'Localização indisponível.',
        3: 'Tempo esgotado ao buscar localização.',
      };

      definirStatus('❌ GPS não disponível.', mensagens[erro.code] || erro.message);
    }

    function iniciarGps() {
      if (!('geolocation' in navigator)) {
        definirStatus('❌ Este navegador não oferece GPS.');
        return;
      }

      if (observadorGps !== null) return;

      botao.disabled = true;
      botao.textContent = 'GPS ATIVO';
      definirStatus('Solicitando permissão de localização...');

      observadorGps = navigator.geolocation.watchPosition(
        aoReceberPosicao,
        aoFalharGps,
        {
          enableHighAccuracy: true,
          maximumAge: 2_000,
          timeout: 15_000,
        },
      );
    }

    botao.addEventListener('click', iniciarGps);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && observadorGps !== null) {
        navigator.geolocation.getCurrentPosition(
          aoReceberPosicao,
          aoFalharGps,
          {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 15_000,
          },
        );
      }
    });
  </script>
</body>
</html>
